<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load fonts WITHOUT blocking the first paint: a render-blocking stylesheet
         would leave the viewport white until the font CSS arrives (worst on a hard
         refresh). preload + swap-to-stylesheet onload lets text appear immediately. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"></noscript>
    <title>Drew Bermudez</title>
    <!-- Lightbulb-with-database-filament mark. PNG first so legacy browsers use
         it; SVG-aware browsers prefer the type=image/svg+xml entry. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#f5f3ee">
    <script>
      if (/^\/moveout(\/|$)/.test(location.pathname)) {
        document.documentElement.classList.add('moveout');
        document.querySelector('meta[name=theme-color]').content = '#ffffff';
      }
    </script>
    <style>
      html, body { margin: 0; background: #f5f3ee; color: #292824; }
      html.moveout, html.moveout body { background: #fff; }
      html.moveout .side-nav, html.moveout .site-explore, html.moveout .site-scroll, html.moveout .site-footer, html.moveout .instant-title { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
